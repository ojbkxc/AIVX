# ── Workspace ────────────────────────────────────────────────────────
# 多 crate 工作区：主控制面 + 数据面（aivx-perception，禁 tokio）+
# 共享事件词汇（aivx-events，仅 serde）+ 协议层（aivx-net，async）。
# crate 边界即 I5/I11 的编译期强制：perception 无法 import 控制面与 tokio。
[workspace]
resolver = "2"
members = [
    ".",          # aivx 主 crate（控制面）
    "aivx-events",
    "aivx-perception",
    "aivx-net",
]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"

[package]
name = "aivx"
version = "0.1.0"
description = "AIVX — AI Video eXtended: high-performance self-hosted AI NVR with three-layer AI, zero-copy frame path and event sourcing"
edition = "2021"
license-file = "LICENSE"

[dependencies]
aivx-events = { path = "aivx-events" }
aivx-perception = { path = "aivx-perception" }
aivx-net = { path = "aivx-net" }

[features]
# 生产推理：转发 aivx-perception 的 ort-yolo（真实 ONNX 推理）。
# CI 默认不启用（ort 重依赖）；部署 build 用 `--features aivx-ort-yolo-dynamic`
# 编真实 YOLO（load-dynamic：编译不链 native 库，运行时 ORT_DYLIB_PATH 加载）。
# 注意：dynamic 必须同时开主 crate 的 aivx-ort-yolo——cameras.rs 的
# make_analyzer cfg 门是主 crate 自己的 feature（线上实证：漏开它 → ort
# 编进依赖图但 make_analyzer 走桩分支，YOLO 静默不生效）。
aivx-ort-yolo = ["aivx-perception/ort-yolo"]
aivx-ort-yolo-dynamic = ["aivx-ort-yolo", "aivx-perception/ort-yolo-dynamic"]

[lib]
name = "aivx"
path = "src/lib.rs"

[[bin]]
name = "aivx"
path = "src/main.rs"

[dependencies.tokio]
version = "1"
features = ["full"]

[dependencies.serde]
workspace = true

[dependencies.serde_json]
workspace = true

[dependencies.thiserror]
workspace = true

[dependencies.anyhow]
workspace = true

[dependencies.reqwest]
version = "0.12"
default-features = false
features = ["blocking", "json", "rustls-tls"]

[dependencies.base64]
version = "0.22"

[dependencies.axum]
version = "0.7"
features = ["macros", "ws"]

[dependencies.tower-http]
version = "0.5"
features = ["fs", "trace"]

[dependencies.serde_yaml]
version = "0.9"
