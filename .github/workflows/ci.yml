name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

  # I5/I11 机器强制：数据面 crate 禁 tokio。
  # cargo tree -i tokio -p aivx-perception 若有依赖则非空退出 → CI 红。
  invariant-crate-boundary:
    name: Invariant I5/I11 (perception no-tokio)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: perception 禁 tokio（出现即失败）
        run: |
          if cargo tree -p aivx-perception --no-dedupe --edges normal --prefix none 2>/dev/null | awk '{print $1}' | grep -qx "tokio"; then
            echo "::error::I5/I11 违反：aivx-perception 依赖了 tokio"
            cargo tree -p aivx-perception --no-dedupe --edges normal --prefix none | grep tokio
            exit 1
          fi
      - name: events 仅 serde（出现其他重依赖即失败）
        run: |
          deps=$(cargo tree -p aivx-events --no-dedupe --edges normal --prefix none 2>/dev/null \
            | awk '{print $1}' | grep -v "^aivx-events" | sort -u)
          bad=$(echo "$deps" | grep -vE "^(serde|serde_derive|serde_core|proc-macro2|quote|syn|unicode-ident)$" || true)
          if [ -n "$bad" ]; then
            echo "::error::aivx-events 出现白名单外依赖:"
            echo "$bad"
            exit 1
          fi

  test:
    name: Test (invariants as code)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: perception 测试（串行——I1 全局分配计数器需独占）
        run: cargo test -p aivx-perception --locked -- --test-threads=1
      - name: yolo 纯逻辑测试（parse_output/nms/iou/nv12——无 ort 依赖，CI 必跑）
        run: "cargo test -p aivx-perception --locked yolo_math -- --test-threads=1"
      - name: ort-yolo 编译验证（yolo.rs 在 feature 下真实编译）
        run: "cargo check -p aivx-perception --locked --features ort-yolo"
      - name: 其余测试（含 ADR-022/023/026/028 机器强制；排除 perception 防重跑污染 I1）
        run: cargo test --workspace --locked --exclude aivx-perception
      - name: 关键不变量测试名单（可视化确认）
        run: |
          cargo test --workspace -- --list 2>/dev/null | grep -E \
            "ordered_fanout_no_gaps|critical_never_lost|seq_recovers|zombie_alarm|calibration_period|concurrent_smoke|i1_|i8_|parse_output|nms_" \
            || (echo "::error::不变量测试缺失" && exit 1)

  build:
    name: Build (release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - name: 骨架自检
        run: ./target/release/aivx

  frontend:
    name: Frontend (tsc + vitest + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 安装依赖
        run: npm ci --prefix frontend
      - name: 类型检查
        run: npm run typecheck --prefix frontend
      - name: I10 机器验证（vitest：capabilities 数据驱动渲染）
        run: npm test --prefix frontend
      - name: 构建产物（输出到 static/）
        run: npm run build --prefix frontend
