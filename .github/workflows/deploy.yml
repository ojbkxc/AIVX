name: Deploy

# P9 部署：CI 绿 → 构建 Linux release 二进制 → 打包（含 static 前端）→ 上传 artifact。
# 服务器侧由本地/服务器上的拉取脚本取 artifact 解包到 /opt/aivx 并重启 systemd。
# （不在 workflow 里内置服务器凭据——凭据不入库，AGENTS.md Never-2。）

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # 一次性辅助 job：生成权威 Cargo.lock（本机不编 Rust，lock 手工补易错）。
  # 生成的 lock 上传 artifact 供人工取回提交；不影响 build-linux。
  gen-lock:
    name: Generate Cargo.lock (with YOLO deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Regenerate lock with download-binaries deps
        # cargo metadata 解析全 feature 依赖图并写 Cargo.lock（无 --dry-run 修饰）。
        # 手工 lock 曾在 --locked 下红——以 cargo 生成结果为权威。
        run: cargo metadata --features aivx-ort-yolo-download --format-version 1 > /dev/null
      - name: Upload lock
        uses: actions/upload-artifact@v4
        with:
          name: cargo-lock
          path: Cargo.lock

  build-linux:
    name: Build linux-amd64 release bundle
    runs-on: ubuntu-22.04   # 目标机 Debian 12 = glibc 2.36；ubuntu-latest(24.04)=2.39 不可运行
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # P8b：生产包带真实 YOLO 推理（aivx-ort-yolo-download → ort
      # download-binaries 自动拉 ONNX Runtime 库并打包进 bundle）。
      - name: Build release (with YOLO)
        run: cargo build --release --locked --features aivx-ort-yolo-download
      - name: Build frontend
        run: |
          npm ci --prefix frontend
          npm run typecheck --prefix frontend
          npm run build --prefix frontend
      # P9b 起二进制常驻（18443 监听）——healthz 探活后杀，超时 10s 兜底
      - name: Self-check
        run: |
          AIVX_PORT=18999 AIVX_STATIC_DIR=static ./target/release/aivx &
          PID=$!
          for i in $(seq 1 50); do
            if curl -sf http://127.0.0.1:18999/api/healthz >/dev/null 2>&1; then
              echo "healthz OK"; kill $PID; exit 0
            fi
            sleep 0.2
          done
          echo "::error::healthz 10s 未就绪"; kill $PID; exit 1
      - name: Assemble bundle
        run: |
          mkdir -p bundle/aivx
          cp target/release/aivx bundle/aivx/
          cp -r static bundle/aivx/static
          # deploy.sh 与 systemd 单元随包分发
          cp deploy/aivx.service bundle/ 2>/dev/null || true
          cp deploy/install.sh bundle/ 2>/dev/null || true
          tar -czf aivx-linux-amd64.tar.gz -C bundle .
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aivx-linux-amd64
          path: aivx-linux-amd64.tar.gz
          retention-days: 14
      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: aivx-linux-amd64.tar.gz
