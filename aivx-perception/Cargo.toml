# aivx-perception —— 数据面（DESIGN.md §2-§4）。
#
# I5/I11 的编译期强制：本 crate 禁 tokio（数据面是同步 OS 线程）。
# CI 断言：cargo tree -i tokio -p aivx-perception 必须为空。
[package]
name = "aivx-perception"
version = "0.1.0"
edition = "2021"
license-file = "../LICENSE"

[dependencies]
aivx-events = { path = "../aivx-events" }
serde = { workspace = true }
serde_json = { workspace = true }

# ort YOLO 后端（P8）——重依赖，feature gate 隔离（CI 默认不编译）。
[features]
ort-yolo = ["dep:ort"]
# ort-yolo + load-dynamic：生产构建用——编译期不链 ONNX Runtime native 库
# （ort/load-dynamic → ort-sys/disable-linking，build.rs 直接 return），
# 运行时按 ORT_DYLIB_PATH dlopen libonnxruntime.so。
# 为什么弃 download-binaries：ort.pyke.io 预编译库按 glibc 2.38+ 构建
# （__isoc23_strtoll 等符号），ubuntu-22.04 runner=2.35 链接失败、目标机
# Debian 12=2.36 运行失败——双重死结。load-dynamic 把 native 库选择权移到
# 部署侧：CI 下载 onnxruntime 官方 release（linux-x64 包 glibc 2.28+ 兼容）
# 随 bundle 分发，systemd 设 ORT_DYLIB_PATH。
# load-dynamic 不激活 download-binaries → ureq/TLS 不参与编译，无 TLS 约束。
ort-yolo-dynamic = ["ort-yolo", "ort/load-dynamic"]

[dependencies.ort]
version = "2.0.0-rc.13"
optional = true
default-features = false
features = ["api-27", "ndarray", "std", "copy-dylibs"]

# 禁 tokio（I5/I11）：CI 断言 cargo tree -i tokio -p aivx-perception 为空。
