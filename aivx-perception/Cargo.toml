# aivx-perception —— 数据面（DESIGN.md §2-§4）。
#
# I5/I11 的编译期强制：本 crate 禁 tokio（数据面是同步 OS 线程）。
# CI 断言：cargo tree -i tokio -p aivx-perception 必须为空。
[package]
name = "aivx-perception"
version = "0.1.0"
edition = "2021"
license-file = "../LICENSE"

[dependencies]
aivx-events = { path = "../aivx-events" }
serde = { workspace = true }
serde_json = { workspace = true }

# ort YOLO 后端（P8）——重依赖，feature gate 隔离（CI 默认不编译）。
# ort 默认 features 含 download-binaries（下载预编译 ONNX Runtime，需网络）。
# CI 沙箱无网 → 编译失败。显式指定 features 去掉 download-binaries，
# 保留 Session API 所需（api-27 + ndarray + std）。本地有网环境可加回
# download-binaries 自动下载 ONNX Runtime。
[features]
ort-yolo = ["dep:ort"]
# ort-yolo + download-binaries：CI/部署构建用——build.rs 自动下载预编译
# ONNX Runtime（默认 ort-yolo 不带它，需系统库；CI runner 无系统 onnxruntime）。
ort-yolo-download = ["ort-yolo", "ort/download-binaries"]

[dependencies.ort]
version = "2.0.0-rc.13"
optional = true
default-features = false
features = ["api-27", "ndarray", "std", "copy-dylibs"]

# 禁 tokio（I5/I11）：CI 断言 cargo tree -i tokio -p aivx-perception 为空。
