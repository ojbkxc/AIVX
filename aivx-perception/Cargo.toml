# aivx-perception —— 数据面（DESIGN.md §2-§4）。
#
# I5/I11 的编译期强制：本 crate 禁 tokio（数据面是同步 OS 线程）。
# CI 断言：cargo tree -i tokio -p aivx-perception 必须为空。
[package]
name = "aivx-perception"
version = "0.1.0"
edition = "2021"
license-file = "../LICENSE"

[dependencies]
aivx-events = { path = "../aivx-events" }
serde = { workspace = true }
serde_json = { workspace = true }

# ort YOLO 后端（P8）——重依赖，feature gate 隔离（CI 默认不编译）。
# 用 ort **默认 features**（含 Session 类型）。download-binaries 是 opt-in
#（不启用 → 不触发 ureq 下载 ONNX Runtime，避免 CI 沙箱无网失败）。
[features]
ort-yolo = ["dep:ort"]

[dependencies.ort]
version = "2.0.0-rc.6"
optional = true

# 禁 tokio（I5/I11）：CI 断言 cargo tree -i tokio -p aivx-perception 为空。
